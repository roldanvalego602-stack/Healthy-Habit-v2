name: Healthy Habit - seguridad beta en Firebase Emulator

on:
  push:
    branches: [main]
    paths:
      - 'firestore.beta.rules'
      - 'storage.beta.rules'
      - 'firebase.beta.emulator.json'
      - 'tools/firestore-tests/**'
      - 'functions/**'
      - '.github/workflows/beta_security_emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-security-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reglas_beta:
    name: Autorización real y pruebas negativas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-healthy-habit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Instalar dependencias
        run: |
          npm ci --prefix functions
          npm install --prefix tools/firestore-tests --ignore-scripts --no-audit --no-fund
      - name: Validar reglas estrictas y flujos de cliente con emuladores
        run: |
          npx --yes firebase-tools@15.34.1 emulators:exec \
            --config firebase.beta.emulator.json \
            --only auth,firestore,functions,storage \
            --project demo-healthy-habit \
            "npm --prefix tools/firestore-tests run test:beta && npm --prefix tools/firestore-tests run test:cliente-integral && npm --prefix tools/firestore-tests run test:evidencias-storage && node --test functions/tests-emulator/shop_catalog.integration.js"
