name: Healthy Habit - verificar modelo ONNX real

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/verify_food_model.py'
      - '.github/workflows/verify_food_model.yml'

permissions:
  contents: read

jobs:
  verificar:
    name: Descargar pesos fijados y ejecutar un tensor ONNX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar runtime únicamente en el entorno de prueba
        run: python -m pip install --disable-pip-version-check onnxruntime==1.22.1 numpy==2.2.6
      - name: Verificar pesos, clases y ejecución sin datos personales
        run: python tools/verify_food_model.py
