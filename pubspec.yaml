name: healthy_habit
description: "Una aplicación demasiado insana para mortales."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0          # Núcleo de Firebase
  cloud_firestore: ^5.0.0       # Base de datos NoSQL
  cloud_functions: ^5.0.0     # Firebase callable functions (compatible con firebase_core 3.x)
  firebase_auth: ^5.0.0         # Autenticación (para los logins y registros)
  google_sign_in: ^6.2.2
  
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  image: ^4.5.4
  flutter_svg: ^2.0.17
  firebase_storage: ^12.4.10
  draggable_fab: ^0.1.4
  push: ^3.3.3
  url_launcher: ^6.3.2
  geolocator: 14.0.2
  http: ^1.6.0
  speech_to_text: '>=7.3.0 <7.5.0'
  flutter_tts: ^4.2.5
  package_info_plus: ^9.0.1
  flutter_local_notifications: 19.5.0
  flutter_timezone: ^5.1.1
  timezone: ^0.10.1
  pedometer: ^4.1.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  assets:
    - assets/logo/logo.png
    - assets/logo/MrHealty.png
    - assets/mascot/healthy.png
    - "assets/monedas/h coin.png"
    - "assets/monedas/h coin premium.png"
    - assets/images/catalogo/
    - assets/avatares/
    - assets/banners/
    - assets/vestimenta/
    - assets/knowledge/
    - assets/cosmeticos/mr_healthy/cabeza/
    - assets/cosmeticos/mr_healthy/rostro/
    - assets/cosmeticos/mr_healthy/torso/
    - assets/cosmeticos/mr_healthy/brazos_manos/
    - assets/cosmeticos/mr_healthy/pies/
    - assets/cosmeticos/mr_healthy/espalda/
    - assets/cosmeticos/mr_healthy/skins/
    - assets/cosmeticos/mr_healthy/skins/
    - assets/cosmeticos/perfil/banners/
    - assets/cosmeticos/perfil/marcos/
    - assets/cosmeticos/perfil/avatares_animados/
    - assets/cosmeticos/social/reacciones/

flutter_launcher_icons:
  min_sdk_android: 21
  android: true
  ios: false
  # Imagen oficial seleccionada por el equipo; no redibujar ni sustituir.
  image_path: "assets/icon/icono de app.png"
  # Android 8+: conservar el diseño completo del archivo subido.
  adaptive_icon_foreground: "assets/icon/icono de app.png"
  adaptive_icon_background: "#087F5B"
  adaptive_icon_foreground_inset: 0